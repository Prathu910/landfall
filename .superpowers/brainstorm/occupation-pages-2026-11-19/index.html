<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Occupation page mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--news:#F3EEE3;--card:#FBF8F2;--muted:#4a463e;--soft:#6b6558;--rule:#ddd4c2;--slate:#2E4A7D;--saff:#D9731A;--saffT:#A04E0C;--gfg:#1F5136;--gbg:#DDEBDF;--wbg:#E4E9F2;--nfg:#8A2E22;--nbg:#F5DEDA;--sur:#ECE7DC}
*{box-sizing:border-box}body{margin:0;background:var(--news);color:var(--ink);font:16px/1.55 Inter,sans-serif}
.switch{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--rule);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.switch button{font:600 14px Inter;padding:6px 12px;border-radius:999px;border:1px solid var(--ink);background:#fff;cursor:pointer}.switch button[aria-pressed=true]{background:var(--ink);color:var(--news)}
header.site{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--card)}
header.site b{font:600 20px Newsreader,serif}header.site nav{margin-left:auto;display:flex;gap:18px;font-size:14px;color:var(--muted)}header.site nav .on{color:var(--ink);font-weight:600;text-decoration:underline}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.crumb{font-size:13px;color:var(--soft)}.crumb a{color:var(--slate)}
h1{font:600 36px/1.1 Newsreader,serif;margin:6px 0 4px}h1 small{display:block;font:500 16px Inter;color:var(--soft);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sur);color:var(--muted)}.chip.g{background:var(--gbg);color:var(--gfg)}.chip.n{background:var(--nbg);color:var(--nfg)}
.says{background:var(--ink);color:var(--card);border-radius:14px;padding:20px 22px;margin:18px 0}.says .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--news)}.says p{font:600 22px/1.3 Newsreader,serif;margin:8px 0 0}.says .src{font:13px Inter;color:#d6cfbf;margin-top:10px}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
section.b{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin:16px 0}
h2{font:600 22px/1.2 Newsreader,serif;margin:0 0 4px}.lede{color:var(--muted);margin:0 0 12px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px}.stat b{display:block;font:600 24px Newsreader,serif}.stat span{font-size:13px;color:var(--soft)}
.bars{display:grid;gap:3px}.bar{display:grid;grid-template-columns:44px 1fr 64px;gap:8px;align-items:center;font-size:13px}.bar i{display:block;height:14px;background:var(--slate);border-radius:3px}.bar i.m{background:repeating-linear-gradient(45deg,#c9c1b0 0 4px,#e6dfd0 4px 8px)}.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rounds{display:grid;gap:4px}.rr{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;font-size:13px}.track{position:relative;height:22px;background:linear-gradient(var(--rule),var(--rule)) center/100% 1px no-repeat}.dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}.nl{color:var(--soft);font-size:13px}
.coh{display:grid;gap:4px}.cr{display:grid;grid-template-columns:72px 1fr 54px;gap:8px;align-items:center;font-size:13px}.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:#eee}.stack i{display:block}.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:8px 0 0}.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}td small{color:var(--soft)}
.try{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px}.try .row{display:flex;gap:8px;margin:8px 0}.sel{flex:1;border:1px solid #cfc5b0;border-radius:8px;padding:8px 10px}.cta{display:block;text-align:center;background:var(--ink);color:var(--news);padding:10px;border-radius:9px;font-weight:600;margin-top:10px}
.alert{margin-top:12px;border:1px dashed var(--soft);border-radius:12px;padding:12px}.alert input{width:100%;padding:8px;border:1px solid #cfc5b0;border-radius:8px;margin:6px 0}.alert small{color:var(--soft)}
details{border-bottom:1px solid var(--rule);padding:10px 0}summary{font-weight:600;cursor:pointer}details p{margin:8px 0 0;color:var(--muted)}
.rel{display:flex;flex-wrap:wrap;gap:8px}.rel a{background:#fff;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;color:var(--slate);font-size:14px;text-decoration:none}
.foot{font-size:13px;color:var(--soft);margin-top:18px}
.ann{background:#FFF7E0;border:1px solid #E8C873;border-radius:10px;padding:10px 12px;margin:16px 0;font-size:14px}
.rt{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}@media(max-width:620px){.rt{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tile.on{background:#E4E9F2;border:1px solid #2E4A7D}.tile.off{background:transparent;border:1.5px dashed #c9c1b0}
.tile .when{font-size:12px;color:#4a463e;line-height:1.25}.tile b{font:600 26px/1.1 Newsreader,serif;margin-top:6px}.tile .u{font-size:12px;color:#4a463e}.tile .nl2{font:600 13px/1.3 Inter;color:#8A2E22;margin-top:12px}
.axisnote{display:flex;justify-content:space-between;font-size:12px;color:#6b6558;margin-top:6px}
.strip{position:relative;height:120px;margin:4px 8px 0}.strip .line{position:absolute;left:0;right:0;top:58px;height:2px;background:#ddd4c2}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:44px}.mk .v{font:600 20px/1 Newsreader,serif;height:34px;display:flex;align-items:flex-end}.mk .pin{width:14px;height:14px;border-radius:50%;margin:10px 0 6px;background:#2E4A7D;border:2px solid #fff;box-shadow:0 0 0 1px #2E4A7D}
.mk.off .pin{background:#fff;box-shadow:0 0 0 1.5px #c9c1b0}.mk.off .v{color:#c9c1b0}.mk .d{font-size:11.5px;color:#4a463e;text-align:center;line-height:1.2}
.strip .yr{position:absolute;top:104px;font-size:11px;color:#6b6558;transform:translateX(-50%);display:none}
</style></head><body>
<div class="switch"><b>Mockup · real data, as at Oct 2026:</b><button data-o="se" aria-pressed="true">Software Engineer 261313</button><button data-o="rn">Registered Nurses nec 254499</button><span style="margin-left:14px"><b>189 rounds:</b></span><button data-r="tiles" aria-pressed="true">A · Round cards</button><button data-r="columns">B · Columns on a timeline</button><button data-r="dots">Current (dots)</button></div>
<header class="site"><svg width="26" height="26" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#1B1A17" stroke-width="3.5"/><rect x="15" y="25" width="4.5" height="8" rx="1" fill="#1B1A17"/><rect x="21.75" y="20" width="4.5" height="13" rx="1" fill="#1B1A17"/><rect x="28.5" y="15" width="4.5" height="18" rx="1" fill="#D9731A"/></svg><b>MigrateLens</b><nav><span class="on">Occupations</span><span>Sample report</span><span>States</span><span>Method</span></nav></header>
<main id="page"></main>
<script>
const O={
se:{code:"261313",name:"Software Engineer",group:"Software and Applications Programmers (2613)",
 chips:[["189: no recent invitations","n"],["190 eligible",""],["491 eligible",""]],
 says:"189 hasn't listed Software Engineer in its last four rounds; the last cut-off was 95 points, in Nov 2024. The 189 pool holds 9,464 EOIs, 7,847 of them at 65 to 90 points.",
 stats:[["9,464","EOIs in the 189 pool"],["20,258","EOIs in the 190 pool"],["21,815","EOIs in the 491 pool"]],
 pool:{"55":206,"60":406,"65":1219,"70":1393,"75":1552,"80":1338,"85":1213,"90":1132,"95":608,"100":229,"105":35,"110":"<20"},
 rounds:[["Oct 2026",null],["Jun 2026",null],["Nov 2025",null],["Aug 2025",null],["Nov 2024",95],["Sep 2024",100],["Jun 2024",100],["Dec 2023",null]],
 roundsNote:"Not listed in the last 4 rounds. When it was last listed (Jun to Nov 2024), cut-offs were 95 to 100.",
 coh:[["Oct 25",[0,0,490,0]],["Dec 25",[0,0,314,0]],["Feb 26",[0,0,289,0]],["Apr 26",[0,0,305,0]],["Jun 26",[0,0,325,0]],["Aug 26",[0,0,317,0]],["Oct 26",[0,0,366,0]]],
 cohNote:"In every month since Sep 2025, invited and lodged Software Engineer EOIs are each published as under 20 (so may be zero); the rest are almost all still waiting.",
 states:[["NSW","190","Living in NSW, elsewhere in Australia, or offshore","0–38"],["WA","190, 491","Living in WA, elsewhere in Australia, or offshore (Schedule 2, Graduate)","0"],["QLD","190, 491","Living in QLD only","0"],["SA","190, 491","Living in SA only","0"],["VIC","Rules being checked","All occupations on the federal list (reported)","0"],["ACT","Rules being checked","Canberra Matrix","under 20"],["TAS","Rules being checked","Mostly living in TAS","under 20"],["NT","Rules being checked","Reported closed for 190","under 20"]],
 faq:[["Is 85 points enough for Software Engineer 189?","No round since Nov 2024 has listed Software Engineer, so there is no recent cut-off to compare against. When it was last listed (Jun to Nov 2024), cut-offs were 95 to 100. As at Oct 2026, 2,004–2,023 EOIs in the 189 pool have more than 85 points."],["When did 189 last invite Software Engineers?","The last round that listed Software Engineer was 7 Nov 2024, at 95 points. It has not been listed in the four rounds since (21 Aug 2025 to 15 Oct 2026)."],["Which states nominate Software Engineers?","NSW and WA list it for 190 and take people living elsewhere in Australia or offshore; QLD and SA list it only for people living there. VIC, ACT, TAS and NT rules are still being checked. As at Oct 2026, every state's 190 invitations for Software Engineer were published as under 20 or zero at each score."]],
 rel:["Analyst Programmer 261311","Developer Programmer 261312","Software Tester 261314","Software and Applications Programmers nec 261399"]},
rn:{code:"254499",name:"Registered Nurses nec",group:"Registered Nurses (2544)",
 chips:[["189: regular invitations","g"],["190 eligible",""],["491 eligible",""]],
 says:"189 listed Registered Nurses nec in each of its last four rounds, at 70 to 80 points. Of the EOIs submitted in Mar 2026, 129 are invited and 45 have lodged a visa application.",
 stats:[["4,280","EOIs in the 189 pool"],["7,677","EOIs in the 190 pool"],["5,072","EOIs in the 491 pool"]],
 pool:{"50":68,"55":197,"60":496,"65":1532,"70":1841,"75":80,"80":27,"85":"<20"},
 rounds:[["Oct 2026",70],["Jun 2026",75],["Nov 2025",75],["Aug 2025",80],["Nov 2024",70],["Sep 2024",75],["Jun 2024",85],["Dec 2023",65]],
 roundsNote:"Listed in every one of the last 8 rounds, at 65 to 85 points. The latest cut-off was 70.",
 coh:[["Oct 25",[102,26,88,97]],["Dec 25",[108,39,131,160]],["Feb 26",[182,83,367,187]],["Apr 26",[98,49,249,62]],["Jun 26",[151,39,250,27]],["Aug 26",[126,72,301,0]],["Oct 26",[40,0,415,0]]],
 cohNote:"Every month since Sep 2025 has EOIs invited: from 40 (Oct 2026, the newest month) to 182, and up to 111 a month have lodged a visa application.",
 states:[["VIC","Rules being checked","All occupations on the federal list (reported)","337–375"],["NSW","190","Living in NSW, elsewhere in Australia, or offshore","327–346"],["QLD","190, 491","Living in QLD, or offshore","260–298"],["WA","190, 491","Living in WA, elsewhere in Australia, or offshore (Schedule 1)","253–291"],["SA","190, 491","Living in SA, or offshore","124–143"],["ACT","Rules being checked","Canberra Matrix","28–85"],["TAS","Rules being checked","Mostly living in TAS; offshore with a health job offer","28–123"],["NT","Rules being checked","Reported closed for 190","24–62"]],
 faq:[["Is 75 points enough for Registered Nurses nec 189?","The last four rounds listed it at 70 to 80 points, so 75 is within that range; the latest cut-off (15 Oct 2026) was 70. As at Oct 2026, 27 to 46 EOIs in the 189 pool have more than 75 points. Past cut-offs are history, not a promise."],["When did 189 last invite Registered Nurses nec?","On 15 Oct 2026, at 70 points. It has been listed in every one of the last 8 rounds."],["Which states nominate Registered Nurses nec?","NSW, QLD, SA and WA list it for 190; QLD, SA and WA for 491 too. As at Oct 2026, Victoria (at least 337) and NSW (at least 327) had the most 190 invitations for it."]],
 rel:["Registered Nurse (Aged Care) 254412","Registered Nurse (Medical) 254418","Registered Nurse (Mental Health) 254422","Registered Nurse (Critical Care and Emergency) 254415"]}};
const DATES=["2026-10-15","2026-06-04","2025-11-13","2025-08-21","2024-11-07","2024-09-05","2024-06-13","2023-12-18"];
let RS="tiles";
const SHORT=d=>{const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];const[y,mo,da]=d.split("-");return {day:+da,mon:m[+mo-1],yr:y}};
function roundsTiles(r){const items=r.map((x,i)=>({d:SHORT(DATES[i]),c:x[1]})).reverse();
 return `<div class="rt">${items.map(it=>`<div class="tile ${it.c===null?"off":"on"}"><span class="when">${it.d.day} ${it.d.mon}<br>${it.d.yr}</span>${it.c===null?`<b class="nl2">Not listed</b>`:`<b>${it.c}</b><span class="u">points</span>`}</div>`).join("")}</div><div class="axisnote"><span>← older</span><span>newer →</span></div>`}
function roundsColumns(r){const W=560,H=190,pad=34,t0=Date.parse("2023-11-01"),t1=Date.parse("2026-12-01"),x=d=>pad+(Date.parse(d)-t0)/(t1-t0)*(W-pad-10),lo=60,hi=105,y=v=>H-26-(v-lo)/(hi-lo)*(H-50);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(const v of [70,80,90,100]){g+=`<line x1="${pad}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eee5d6"/><text x="${pad-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#6b6558">${v}</text>`}
 for(const yr of ["2024","2025","2026"]){const xx=x(yr+"-01-01");g+=`<line x1="${xx}" x2="${xx}" y1="16" y2="${H-26}" stroke="#ddd4c2" stroke-dasharray="3 3"/><text x="${xx+4}" y="${H-8}" font-size="11.5" fill="#4a463e">${yr}</text>`}
 r.forEach((it,i)=>{const xx=x(DATES[i]);if(it[1]===null){g+=`<circle cx="${xx}" cy="${H-30}" r="5" fill="#fff" stroke="#8A2E22" stroke-width="1.5"/><text x="${xx}" y="${H-40}" font-size="10.5" text-anchor="middle" fill="#8A2E22">✕</text>`}else{g+=`<rect x="${xx-9}" y="${y(it[1])}" width="18" height="${H-26-y(it[1])}" rx="3" fill="#2E4A7D"/><text x="${xx}" y="${y(it[1])-5}" font-size="12" font-weight="700" text-anchor="middle" fill="#1B1A17">${it[1]}</text>`}});
 return g+`</svg><div class="leg"><span style="--c:#2E4A7D">Cut-off (points) in a round that listed it</span><span style="--c:#fff;outline:1.5px solid #8A2E22">Round that didn't list it</span></div>`}
function roundsStrip(r){const t0=Date.parse("2023-11-01"),t1=Date.parse("2026-12-01"),x=d=>(Date.parse(d)-t0)/(t1-t0)*100;
 return `<div class="strip"><div class="line"></div>${r.map((it,i)=>`<div class="mk ${it[1]===null?"off":"on"}" style="left:${x(DATES[i])}%"><span class="v">${it[1]===null?"–":it[1]}</span><span class="pin"></span><span class="d">${SHORT(DATES[i]).mon}<br>${SHORT(DATES[i]).yr.slice(2)}</span></div>`).join("")}${["2024","2025","2026"].map(yr=>`<span class="yr" style="left:${x(yr+"-01-01")}%">${yr}</span>`).join("")}</div><div class="leg"><span style="--c:#2E4A7D">Listed: the number is the cut-off</span><span style="--c:#c9c1b0">Not listed in that round</span></div>`}
function roundsView(r){return RS==="tiles"?roundsTiles(r):RS==="columns"?roundsColumns(r):RS==="strip"?roundsStrip(r):rounds(r)}
const C=["#1F5136","#6b6558","#D9731A","#c9c1b0"];
function poolBars(p){const vals=Object.values(p).map(v=>v==="<20"?19:v);const mx=Math.max(...vals);return Object.entries(p).map(([s,v])=>{const n=v==="<20"?19:v;return `<div class="bar"><span>${s}</span><i class="${v==="<20"?"m":""}" style="width:${Math.max(2,n/mx*100)}%"></i><span>${v==="<20"?"under 20":n.toLocaleString()}</span></div>`}).join("")}
function rounds(r){const lo=60,hi=105,x=v=>(v-lo)/(hi-lo)*100;return r.map(([m,c])=>`<div class="rr"><span>${m}</span><span class="track">${c===null?'<span class="nl">○ not listed</span>':`<span class="dot" style="left:${x(c)}%"></span>`}</span><span style="text-align:right">${c===null?"—":c+" pts"}</span></div>`).join("")}
function coh(rows){const mx=Math.max(...rows.map(r=>r[1].reduce((a,b)=>a+b,0)));return rows.map(([m,v])=>{const t=v.reduce((a,b)=>a+b,0);return `<div class="cr"><span>${m}</span><span class="stack" style="width:${t/mx*100}%">${v.map((n,i)=>`<i style="width:${n/t*100}%;background:${C[i]}"></i>`).join("")}</span><span style="text-align:right">${t}</span></div>`}).join("")}
function render(k){const o=O[k];document.getElementById("page").innerHTML=`
<div class="crumb"><a>Occupations</a> › ${o.group} › ${o.name}</div>
<h1>${o.name} (${o.code})<small>Australian skilled visas: 189, 190 and 491 EOIs, cut-offs and invitations · as at Oct 2026</small></h1>
<div class="chips">${o.chips.map(([t,c])=>`<span class="chip ${c}">${t}</span>`).join("")}</div>
<div class="says"><div class="k">What the data says</div><p>${o.says}</p><div class="src">SkillSelect (Department of Home Affairs), snapshot 31 Oct 2026 · counts are EOIs, and one person can hold several · updated monthly</div></div>
<div class="grid2"><div>
<section class="b"><h2>Who's in the 189 pool</h2><p class="lede">EOIs waiting for a 189 invitation, by points. Striped bars are published as "under 20".</p><div class="stats">${o.stats.map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("")}</div><div class="bars">${poolBars(o.pool)}</div><p class="foot">190 and 491 pools have their own charts on the page (tabs).</p></section>
<section class="b"><h2>189 invitation rounds</h2><p class="lede">${o.roundsNote}</p><div class="rounds">${roundsView(o.rounds)}</div></section>
<section class="b"><h2>What happened to EOIs submitted each month</h2><p class="lede">${o.cohNote}</p><div class="coh">${coh(o.coh)}</div><div class="leg"><span style="--c:${C[0]}">Invited</span><span style="--c:${C[1]}">Lodged a visa</span><span style="--c:${C[2]}">Still waiting</span><span style="--c:${C[3]}">Closed</span></div></section>
</div><aside>
<section class="b try"><h2>Your points against this pool</h2><p class="lede">See where your EOI would sit, then get the full free report.</p><div class="row"><span class="sel">${o.name}</span></div><div class="row"><span class="sel">Your points: 85 ▾</span></div><a class="cta">Check my points, free</a>
<div class="alert"><b>Tell me when this changes</b><br><small>One email when 189 lists ${o.name} in a round or a state list changes. Nothing else.</small><input placeholder="you@example.com"><small>Free while we test whether alerts help. Unsubscribe anytime.</small></div></section>
</aside></div>
<section class="b"><h2>State and territory nomination (190 and 491)</h2><p class="lede">Which official state lists include ${o.name}, who each is open to, and the EOIs each state had invited for 190 as at Oct 2026 (any score).</p>
<table><tr><th>State</th><th>On its 2026–27 list</th><th>Open to</th><th>190 invited</th></tr>${o.states.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td></tr>`).join("")}</table><p class="foot">Each state is linked to its official page. "Rules being checked" means we haven't confirmed that state's rules on its official page yet.</p></section>
<section class="b"><h2>Common questions</h2>${o.faq.map(([q,a],i)=>`<details ${i===0?"open":""}><summary>${q}</summary><p>${a}</p></details>`).join("")}</section>
<section class="b"><h2>Related occupations</h2><div class="rel">${o.rel.map(r=>`<a>${r}</a>`).join("")}</div></section>
<p class="foot">Sources: SkillSelect EOI dashboard and invitation rounds (Department of Home Affairs), state nomination pages, the Home Affairs skilled occupation list. Last updated 18 Nov 2026. General information, not migration advice. MigrateLens is not a registered migration agent.</p>
<div class="ann"><b>Mockup notes.</b> Every number is real (as at Oct 2026). The state invitation counts add up EOIs in "invited" status by score, keeping "under 20" as a range. The alert box only collects interest; nothing is sent until you decide on the email service. Related occupations come from the same ANZSCO unit group.</div>`}
let CUR="se";
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-o]").forEach(x=>x.setAttribute("aria-pressed",x===b));CUR=b.dataset.o;render(CUR)});
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b));RS=b.dataset.r;render(CUR)});
render("se");
</script></body></html>
