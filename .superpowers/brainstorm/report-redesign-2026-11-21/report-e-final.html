<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option E scenarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Big+Shoulders+Stencil+Display:wght@800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF; --wash: #EEF2F0; --ink: #12202C; --muted: #52606B; --rule: #D8DFDB; --cobalt: #2446D6;
    --vs: #0F6B3C; --vs-bg: #D6EFE0; --st: #1E7A4C; --st-bg: #E5F3EA; --co: #A06400; --co-bg: #FBEFD6;
    --lw: #C2410C; --lw-bg: #FDE8DB; --ni: #B42318; --ni-bg: #FCE5E3; --ne: #5B3F9E; --ne-bg: #ECE6F8; --nd: #586470; --nd-bg: #E8ECEF;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--wash); color: var(--ink); font: 400 17px/1.55 "Archivo", system-ui, sans-serif; }
  h1, h2, h3 { font-stretch: 116%; font-weight: 750; letter-spacing: -0.01em; margin: 0; }
  .switch { position: sticky; top: 0; z-index: 50; background: var(--ink); color: #fff; padding: 10px 12px; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 14px; }
  .switch button { font: inherit; font-weight: 500; border: 1px solid #ffffff4d; background: transparent; color: #fff; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .switch button.on { background: #fff; color: var(--ink); }
  .switch button:focus-visible { outline: 3px solid #8FB0FF; outline-offset: 2px; }
  .brief { max-width: 900px; margin: 18px auto 0; padding: 0 16px; font-size: 15px; color: var(--muted); }
  .brief b { color: var(--ink); }
  .page { max-width: 900px; margin: 16px auto 64px; background: var(--paper); border-radius: var(--r); overflow: hidden; }
  .pad { padding: 40px 52px; }
  @media screen and (max-width: 720px) { .page { margin: 8px 0 40px; border-radius: 0; } .pad { padding: 26px 18px; } }
  .who { font-size: 15px; color: var(--muted); }
  .who b { color: var(--ink); font-weight: 600; }

  /* hero */
  .hero { position: relative; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 28px; align-items: center; overflow: hidden; }
  .hero > * { position: relative; }
  .hero .guill { position: absolute; inset: -40px; opacity: .5; pointer-events: none; }
  .hero h1 { font-size: clamp(30px, 4.4vw, 42px); line-height: 1.08; margin: 10px 0 12px; }
  .hero .fact { font-size: 19px; line-height: 1.45; margin: 0 0 16px; }
  .read { background: #ffffffd9; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
  .read b { display: block; margin-bottom: 3px; }
  .read small { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .meta { display: grid; gap: 4px; margin-top: 14px; font-size: 15px; }
  .meta div b { font-weight: 600; }
  .why { font-size: 14px; color: var(--muted); }
  .stampwrap svg { width: 100%; }
  @media screen and (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero .stampwrap { max-width: 280px; margin: 0 auto; order: -1; } }

  /* visa row */
  .visas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .visas figure { margin: 0; text-align: center; }
  .visas figcaption { margin-top: 6px; font-size: 15px; }
  .visas figcaption b { display: block; font-weight: 600; }
  .visas figcaption span { color: var(--muted); font-size: 14px; }
  .visas svg { max-width: 220px; margin: 0 auto; display: block; }
  @media screen and (max-width: 720px) { .visas { grid-template-columns: 1fr; } }

  .band { border-top: 1px solid var(--rule); }
  .band.tint { background: #F7F9F8; }
  .sec-h { margin-bottom: 4px; font-size: 24px; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .two h3 { font-size: 19px; }
  @media screen and (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  .empty { border: 1.5px dashed var(--rule); border-radius: 12px; padding: 22px; color: var(--muted); font-size: 15px; background: #fff; }
  svg { display: block; max-width: 100%; height: auto; }
  svg text { font-family: "Archivo", sans-serif; }

  /* improve */
  .banner { border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; font-size: 16px; }
  .moves { display: grid; gap: 12px; }
  .move { display: grid; grid-template-columns: 1fr 270px; gap: 16px; align-items: center; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 18px; background: #fff; }
  .move.best { border: 2px solid var(--vs); }
  .move h3 { font-size: 18px; font-stretch: 105%; }
  .move p { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
  .move .tag { font-size: 13px; font-weight: 600; color: var(--vs); }
  @media screen and (max-width: 720px) { .move { grid-template-columns: 1fr; } }
  .deadline { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: baseline; border-radius: 12px; padding: 14px 18px; background: var(--ni-bg); margin-top: 12px; font-size: 16px; }
  .deadline .n { font-weight: 800; font-size: 24px; font-stretch: 116%; color: var(--ni); }
  .plain { margin: 0; padding-left: 20px; }
  .plain li { margin: 6px 0; }

  details.ev summary { cursor: pointer; font-stretch: 116%; font-weight: 750; font-size: 21px; list-style: none; display: flex; align-items: center; gap: 10px; }
  details.ev summary::before { content: "+"; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink); font-weight: 600; }
  details.ev[open] summary::before { content: "−"; }
  details.ev summary span { font-weight: 400; font-size: 15px; color: var(--muted); font-stretch: 100%; }
  .evgrid { display: grid; gap: 28px; margin-top: 22px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  table.t th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 8px 6px 0; border-bottom: 1.5px solid var(--ink); font-size: 14px; }
  table.t td { padding: 8px 8px 8px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  .tablewrap { overflow-x: auto; }

  /* data page */
  .dp { display: grid; grid-template-columns: 130px 1fr; gap: 22px; }
  .photo { width: 130px; height: 164px; border-radius: 8px; background: #E9EEEA; border: 1px solid var(--rule); overflow: hidden; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; font-size: 15px; }
  .fields span { display: block; font-size: 13px; color: var(--muted); }
  table.pts { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 15px; font-variant-numeric: tabular-nums; }
  table.pts td { padding: 8px 0; border-top: 1px solid var(--rule); vertical-align: top; }
  table.pts td.d { color: var(--muted); padding-left: 14px; }
  table.pts td.n { text-align: right; font-weight: 700; width: 48px; }
  table.pts tr.z td { color: #8A949C; }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .totals div { background: var(--wash); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .totals b { display: block; font-size: 28px; font-stretch: 116%; font-weight: 800; color: var(--ink); line-height: 1.1; }
  .mrz { margin-top: 18px; font: 500 14px/1.6 "IBM Plex Mono", monospace; letter-spacing: .1em; background: var(--wash); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre; color: #34414D; }
  @media screen and (max-width: 720px) { .dp { grid-template-columns: 1fr; } .fields { grid-template-columns: 1fr; } .totals { grid-template-columns: 1fr; } }

  footer.g { background: var(--ink); color: #CBD3DA; padding: 20px 52px; font-size: 14px; }
  footer.g b { color: #fff; }
  @media screen and (max-width: 720px) { footer.g { padding: 18px; } }

  .chip { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }

  /* rules */
  .rules table.t td:first-child { width: 190px; }
  .callout { background: #F7F9F8; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 18px; font-size: 15px; }
  .callout + .callout { margin-top: 10px; }

  /* ===== mobile + tablet ===== */
  .narrow { display: none; }
  .rnav { display: none; }
  .meta .tile b { font-weight: 600; }
  .method { font-size: 15px; color: var(--muted); }
  .method ul { margin: 8px 0 0; padding-left: 18px; }
  .method li { margin: 4px 0; }
  .method b { color: var(--ink); font-weight: 600; }
  ol.vroute { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.vroute::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 3px; background: repeating-linear-gradient(#2446D6 0 3px, transparent 3px 9px); }
  ol.vroute li { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: center; padding: 8px 0; }
  ol.vroute .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; position: relative; z-index: 1; }
  ol.vroute .dot.hollow { background: #fff; border: 4px solid var(--ink); width: 26px; height: 26px; margin: 9px; }
  ol.vroute b { display: block; font-size: 17px; }
  ol.vroute span { color: var(--muted); font-size: 15px; }
  ol.vroute li.dl { grid-template-columns: 44px 1fr; }
  ol.vroute li.dl .flag { background: var(--ni-bg); color: var(--ni); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  ol.vroute li.dl .flag b { font-size: 15px; display: inline; }
  ol.vroute li.dl .pin { width: 14px; height: 14px; border-radius: 50%; background: var(--ni); margin-left: 15px; position: relative; z-index: 1; }

  @media screen and (max-width: 1023px) {
    .rnav { display: flex; gap: 6px; overflow-x: auto; position: sticky; top: var(--navtop, 44px); z-index: 20; background: #fffffff2; backdrop-filter: blur(6px); padding: 10px 16px; border-bottom: 1px solid var(--rule); scrollbar-width: none; }
    .rnav::-webkit-scrollbar { display: none; }
    .rnav a { flex: none; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; padding: 7px 12px; border-radius: 999px; background: var(--wash); }
    .rnav a:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 1px; }
    .two { grid-template-columns: 1fr; }
    [id] { scroll-margin-top: 110px; }
  }
  @media screen and (max-width: 720px) {
    .wide { display: none; }
    .narrow { display: block; }
    body { font-size: 16px; }
    .hero { gap: 14px; }
    .hero .stampwrap { width: 100%; max-width: 230px; }
    .hero > div:first-of-type { display: flex; flex-direction: column; }
    .hero h1 { font-size: 29px; margin-top: 8px; }
    .hero .fact { font-size: 17px; }
    .hero .meta { order: 4; margin: 0 0 14px; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hero .meta > div:not(.why) { background: var(--wash); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
    .hero .meta > div:not(.why) b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
    .hero .meta .why { grid-column: 1 / -1; }
    .hero .read { order: 5; }
    .visas { gap: 4px; }
    .visas figure { display: grid; grid-template-columns: 116px 1fr; gap: 12px; align-items: center; text-align: left; padding: 6px 0; border-top: 1px solid var(--rule); }
    .visas figure:first-child { border-top: 0; }
    .visas svg { max-width: 116px; margin: 0; }
    .visas figcaption { margin: 0; }
    .sec-h { font-size: 22px; }
    .move { padding: 14px; }
    .move svg { max-width: 300px; }
    table.pts tr { display: grid; grid-template-columns: 1fr auto; }
    table.pts td.d { grid-row: 2; grid-column: 1 / -1; padding: 0 0 8px; border-top: 0; font-size: 14px; }
    table.pts td.n { grid-row: 1; grid-column: 2; }
    .totals { grid-template-columns: repeat(3, 1fr); }
    .totals div { padding: 8px 10px; font-size: 13px; }
    .totals b { font-size: 24px; }
    .dp { grid-template-columns: 1fr; }
    .fields { grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .photo { display: none; }
    .mrz { font-size: 12px; }
    .deadline { font-size: 15px; }
    .banner { font-size: 15px; }
    details.ev summary { font-size: 19px; flex-wrap: wrap; }
    details.ev summary span { flex-basis: 100%; padding-left: 38px; }
  }
  body.embed .switch, body.embed .brief { display: none; }
  body.embed { --navtop: 0px; }
  body.embed .page { margin-top: 0; }

  .print-only, .runfoot { display: none; }
  .dl-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font: inherit; font-weight: 600; font-size: 15px; color: #fff; background: var(--ink); border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .dl-btn:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  @page { size: A4; margin: 14mm 14mm 18mm; }
  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { background: #fff; font-size: 10.5pt; }
    .switch, .brief, .screen-only { display: none !important; }
    .print-only { display: block; }
    .page { margin: 0; max-width: none; border-radius: 0; overflow: visible; }
    .pr h1 { font-size: 24pt; line-height: 1.08; margin: 4pt 0 8pt; }
    .pr h2 { font-size: 15pt; margin: 0 0 2pt; }
    .pr h3 { font-size: 11.5pt; }
    .pr .sub { font-size: 9.5pt; margin: 0 0 8pt; }
    .pr section { padding: 10pt 0; border-top: 1px solid var(--rule); }
    .pr .keep { break-inside: avoid; }
    .pr .phero > *:not(.guill) { position: relative; }
    .pr .phero .guill { position: absolute; inset: -10pt -10pt -10pt 40%; width: auto; height: auto; opacity: .45; }
    .pr section.first { border-top: 0; padding-top: 0; }
    .pr .brandline { display: flex; justify-content: space-between; align-items: baseline; font-size: 9pt; color: var(--muted); padding-bottom: 8pt; border-bottom: 2px solid var(--ink); margin-bottom: 12pt; }
    .pr .brandline b { font-size: 13pt; color: var(--ink); font-stretch: 116%; font-weight: 800; letter-spacing: -0.01em; }
    .pr .phero { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 16pt; align-items: center; position: relative; }
    .pr .phero .fact { font-size: 12pt; line-height: 1.4; margin: 0 0 10pt; }
    .pr .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6pt; margin-bottom: 8pt; }
    .pr .tiles div { background: var(--wash); border-radius: 8px; padding: 6pt 8pt; font-size: 10pt; }
    .pr .tiles b { display: block; font-size: 8.5pt; color: var(--muted); font-weight: 600; }
    .pr .read { font-size: 10pt; padding: 8pt 10pt; }
    .pr .read small { font-size: 8pt; }
    .pr .why { font-size: 8.5pt; margin-top: 6pt; }
    .pr .visas { grid-template-columns: repeat(3, 1fr); gap: 10pt; }
    .pr .visas svg { max-width: 150pt; }
    .pr .visas figcaption { font-size: 9.5pt; }
    .pr .visas figcaption span { font-size: 9pt; }
    .pr .two { grid-template-columns: 1fr 1fr; gap: 18pt; }
    .pr ol.vroute b { font-size: 11pt; } .pr ol.vroute span { font-size: 9.5pt; }
    .pr ol.vroute li { padding: 4pt 0; }
    .pr .moves { gap: 6pt; }
    .pr .move { grid-template-columns: 1fr 190pt; padding: 8pt 10pt; break-inside: avoid; }
    .pr .move h3 { font-size: 11pt; } .pr .move p { font-size: 9.5pt; }
    .pr .deadline, .pr .banner { font-size: 10pt; padding: 8pt 10pt; break-inside: avoid; }
    .pr .deadline .n { font-size: 16pt; }
    .pr .plain { font-size: 10pt; }
    .pr .fields { grid-template-columns: repeat(3, 1fr); font-size: 9.5pt; gap: 6pt 14pt; }
    .pr .fields span { font-size: 8pt; }
    .pr table.pts { font-size: 9.5pt; margin-top: 8pt; } .pr table.pts td { padding: 4pt 0; }
    .pr .totals div { font-size: 8.5pt; padding: 6pt 8pt; } .pr .totals b { font-size: 16pt; }
    .pr .mrz { font-size: 8.5pt; margin-top: 8pt; }
    .pr .method { font-size: 9pt; padding: 0; } .pr .method h2 { font-size: 12pt; }
    .pr .gbox { background: var(--ink); color: #CBD3DA; border-radius: 8px; padding: 9pt 12pt; font-size: 9pt; margin-top: 10pt; break-inside: avoid; }
    .pr .gbox b { color: #fff; }
    .pr .appendix { break-before: page; }
    .pr .appendix .tag { font-size: 9pt; color: var(--muted); }
    .pr table.t { font-size: 8.5pt; } .pr table.t td, .pr table.t th { padding: 2pt 6pt 2pt 0; }
    .pr .appendix h3 { margin-bottom: 4pt; } .pr .appendix .why { font-size: 8pt; }
    .pr .chip { font-size: 8.5pt; padding: 1pt 6pt; }
    .pr .pbreak { break-before: page; }
    .runfoot { display: block; position: fixed; bottom: -12mm; left: 0; right: 0; font-size: 8pt; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 3pt; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 1 1 1 0.8 1"/></feComponentTransfer></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#12202C"/></marker>
  </defs>
</svg>

<style id="pagestyle"></style>
<nav class="switch" id="tabs" aria-label="Scenarios"></nav>
<p class="brief" id="brief"></p>
<main class="page" id="page"></main>

<script>
/* ---------- verdict palette ---------- */
const V = {
  vs: { label: "Very strong", c: "var(--vs)", bg: "var(--vs-bg)", hex: "#0F6B3C" },
  st: { label: "Strong", c: "var(--st)", bg: "var(--st-bg)", hex: "#1E7A4C" },
  co: { label: "Competitive", c: "var(--co)", bg: "var(--co-bg)", hex: "#A06400" },
  lw: { label: "Long wait", c: "var(--lw)", bg: "var(--lw-bg)", hex: "#C2410C" },
  ni: { label: "Not currently invited", c: "var(--ni)", bg: "var(--ni-bg)", hex: "#B42318" },
  ne: { label: "Not eligible yet", c: "var(--ne)", bg: "var(--ne-bg)", hex: "#5B3F9E" },
  nd: { label: "Not enough data", c: "var(--nd)", bg: "var(--nd-bg)", hex: "#586470" },
};
const SHORT = { ni: "Not invited", ne: "Not eligible", nd: "No data" };
const short = k => SHORT[k] || V[k].label;
const fit = (text, width, max, f) => Math.min(max, width / (text.length * (f || 0.6)));
const chip = (k, text) => `<span class="chip" style="background:${V[k].bg};color:${V[k].c}">${text || V[k].label}</span>`;
const esc = s => String(s);

/* ---------- graphics ---------- */
function bigStamp(k, ring, bottom, word) {
  const hex = V[k].hex; const w = (word || V[k].label).toUpperCase();
  const lines = w.length > 12 ? w.split(" ").reduce((a, x) => { const l = a[a.length - 1]; (l && (l + " " + x).length <= 12) ? a[a.length - 1] = l + " " + x : a.push(x); return a; }, []) : [w];
  const fs = fit(lines.reduce((m, l) => l.length > m.length ? l : m, ""), 250, 56, 0.56);
  const y0 = 172 - (lines.length - 1) * fs * 0.5;
  return `<svg viewBox="-24 -24 368 368" role="img" aria-label="Stamp: ${ring}, ${V[k].label}">
    <defs><path id="rt${k}" d="M40 160 A120 120 0 0 1 280 160"/><path id="rb${k}" d="M52 160 A108 108 0 0 0 268 160"/></defs>
    <g filter="url(#ink)" transform="rotate(-7 160 160)">
      <circle cx="160" cy="160" r="150" fill="none" stroke="${hex}" stroke-width="7"/>
      <circle cx="160" cy="160" r="136" fill="none" stroke="${hex}" stroke-width="2.5"/>
      <text font-family="'Big Shoulders Stencil Display'" font-weight="800" font-size="22" fill="${hex}" letter-spacing="2"><textPath href="#rt${k}" startOffset="50%" text-anchor="middle">${ring}</textPath></text>
      <text font-family="'Big Shoulders Stencil Display'" font-weight="800" font-size="19" fill="${hex}" letter-spacing="2"><textPath href="#rb${k}" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">${bottom}</textPath></text>
      <rect x="22" y="${118 - (lines.length - 1) * fs * 0.5}" width="276" height="${84 + (lines.length - 1) * fs}" fill="#fff" stroke="${hex}" stroke-width="5"/>
      ${lines.map((l, i) => `<text x="160" y="${y0 + i * fs}" text-anchor="middle" data-fit="250" font-family="'Big Shoulders Stencil Display'" font-weight="900" font-size="${fs}" fill="${hex}" letter-spacing="1.5">${l}</text>`).join("")}
    </g></svg>`;
}
function visaStamp(shape, k, top, word, bottom, rot) {
  const hex = V[k].hex; const W = word.toUpperCase(); const fs = fit(W, 168, 30, 0.56); const ts = fit(top, 150, 22, 0.62);
  const frame = shape === "rect"
    ? `<rect x="10" y="10" width="200" height="140" rx="16" fill="none" stroke="${hex}" stroke-width="5"/><rect x="20" y="20" width="180" height="120" rx="10" fill="none" stroke="${hex}" stroke-width="2"/>`
    : shape === "hex"
    ? `<polygon points="110,6 206,40 206,120 110,154 14,120 14,40" fill="none" stroke="${hex}" stroke-width="5"/>`

S.forEach(x => { if (APP[x.id]) x.app = APP[x.id]; });

function appendix(s) {
  const a = s.app, you = s.points.totals[0];
  const rounds = a ? a.rounds : s.cut ? s.cut.rounds.map(r => [r.m, r.c]) : [];

  const hist = a && a.pool ? histogram({ you, aria: "189 pool by points", bars: a.pool.map(b => ({ s: b[0], v: b[1], t: b[2] })) }, true) : `<p class="why">No pool counts are published for this occupation.</p>`;
  const stt = (t, title) => t ? `<div><h3>${title} by state, at your ${t.pts} points</h3><table class="t"><tr><th>State</th><th>Latest invited at or below your points</th><th>Outlook</th></tr>${t.rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}${r[2] ? `<br><span class="why">${r[2]} of the last 6 months</span>` : ""}</td><td>${chip(r[3], r[3] === "ni" ? "Not invited" : undefined)}</td></tr>`).join("")}</table></div>` : "";
  return `<div class="appendix"><p class="tag">Appendix</p><h2>The evidence behind your report</h2><p class="sub">Everything the labels and estimates above are built from.</p>
    <div class="two"><div><h3>Every 189 round since 2022</h3>${rtable}</div><div><h3>The 189 pool by points</h3><p class="sub">${a && a.poolNote ? a.poolNote : ""}</p>${hist}</div></div>

    <p class="why" style="margin-top:10pt">Source: SkillSelect EOI data and invitation rounds, Department of Home Affairs, snapshot 31 Oct 2026. Counts are EOIs, and one person can hold several. "Under 20" is published as a range, never a number. State outlooks also depend on each state's rules; ACT, VIC, TAS and NT rules are still being checked.</p></div>`;
}
function renderPrint(s) {
  const p = s.points, imp = s.improve, name = p.name.replace(" (sample)", "");
  const vs = s.visas.map((v, i) => `<figure>${visaStamp(v[0], v[1], v[2], v[3], v[4], [-4, 5, -2][i])}<figcaption><b>${v[5]}</b><span>${v[6]}</span></figcaption></figure>`).join("");
  const moves = imp.plain ? `<ul class="plain">${imp.plain.map(x => `<li>${x}</li>`).join("")}</ul>`
    : `<div class="moves">${imp.moves.map(m => `<div class="move${m.best ? " best" : ""}"><div>${m.best ? '<span class="tag">Biggest jump</span>' : ""}<h3>${m.t}</h3>${m.d ? `<p>${m.d}</p>` : ""}<p style="color:var(--ink)">${m.why}</p></div>${shiftStamps(m.from, m.to)}</div>`).join("")}</div>`;

    <section class="keep"><h2>Your best route</h2><p class="sub">What we'd do with your profile, in order, and the dates that work against you.</p>${routeLine(s.route, 700)}</section>

      <table class="pts">${p.rows.map(r => `<tr><td>${r[0]}</td><td class="d">${r[1]}</td><td class="n">${r[2]}</td></tr>`).join("")}${zeroRow(p.zero)}</table>
      <div class="totals"><div><b>${p.totals[0]}</b>189 Independent</div><div><b>${p.totals[1]}</b>190 with nomination (+5)</div><div><b>${p.totals[2]}</b>491 with nomination (+15)</div></div>
      <div class="mrz" aria-hidden="true">${p.mrz.join("\n").replace(/</g, "&lt;")}</div></section>
    <section class="keep">${methodNote.replace('class="band pad method" id="method"', 'class="method"')}</section>

function renderRules() {
  const rows = [
    ["vs", "Your points are above every cut-off in your occupation's last 3 listed 189 rounds, and fewer than 20 EOIs score higher.", "Aarav, 90"],
    ["st", "Your points meet every cut-off in the last 3 listed rounds.", "A nurse at 75"],
    ["co", "Your points meet the lowest cut-off in the last 3 listed rounds, but not all of them.", "Priya, 70"],
    ["lw", "Your occupation is still being listed, but your points are below every cut-off in its last 3 listed rounds.", "Meera, 80"],
    ["ni", "Your occupation wasn't listed in any of the last 4 189 rounds.", "Rahul, 85"],
    ["ne", "Under 65 points, or a basic requirement fails (age 45 or over, English expired, no valid skills assessment).", "Arjun, 60"],
    ["nd", "No published pool, rounds or state invitations for the occupation. If every count is \"under 20\", the wording becomes \"Too few to count\".", "Sana"],
  ];
  return `<div class="pad rules">
    <h2 class="sec-h">How each label is decided</h2><p class="sub">The big stamp shows your best visa (189 first, then 190, then 491 when labels tie). If none is Competitive or better, one combined stamp covers all three with the best of their labels.</p>
    <div class="tablewrap"><table class="t"><tr><th>Label</th><th>Rule for 189</th><th>Example</th></tr>${rows.map(r => `<tr><td>${chip(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>
    <h2 class="sec-h" style="margin-top:34px">190 and 491, state by state</h2><p class="sub">Each state gets a label at your points with nomination (+5 or +15). The visa's label is its best state.</p>
    <div class="tablewrap"><table class="t"><tr><th>Label</th><th>Rule</th></tr>
      <tr><td>${chip("st")}</td><td>At least 20 confirmed invitations at or below your points in the last 3 months, and at least half of that state's invitations were at or below your points.</td></tr>
      <tr><td>${chip("co")}</td><td>Confirmed invitations at or below your points, but most were above; or "under 20" invitations at or below your points in at least 2 of the last 3 months.</td></tr>
      <tr><td>${chip("lw")}</td><td>The state invited your occupation only above your points, or only once at or below them, in the last 6 months.</td></tr>
      <tr><td>${chip("ni", "Not open to you")}</td><td>Not on the state's list, or its rules (onshore/offshore, residence, work experience) rule you out.</td></tr>
      <tr><td>${chip("nd", "Rules being checked")}</td><td>We haven't verified that state's rules yet (ACT, VIC, TAS, NT today). Evidence is still shown.</td></tr></table></div>
    <h2 class="sec-h" style="margin-top:34px">Other rules the report follows</h2>
    <div class="callout"><b>Estimated wait</b> comes from code, not AI: the next round for Very strong; "possible in a round that goes to your score" for Competitive; rounds-needed at the latest round's pace for people already in the queue; "unlikely without more points" for Long wait; nothing for Not currently invited or Not enough data.</div>
    <div class="callout"><b>How to improve</b> re-runs these same rules on your profile with each change, so the new label is always consistent with the headline. Changes come from your answers: English band, NAATI, Professional Year (for eligible occupations), partner skills, the next experience band, and dated losses (birthdays, English and EOI expiry).</div>
    <div class="callout"><b>"Under 20"</b> is never shown as a number. When a range decides a label, we take the cautious reading.</div>
    <div class="callout"><b>The AI summary</b> ("Our read") gets the computed facts only. Any number it writes is checked against those facts before the report is shown; if a check fails, we show a plain template sentence instead.</div>
    <div class="callout"><b>Footer:</b> every report ends with the not-a-guarantee note.</div>
  </div>`;
}
const tabs = document.getElementById("tabs"), page = document.getElementById("page"), brief = document.getElementById("brief");
S.forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.tab; b.dataset.choice = "scenario-" + s.id; b.onclick = () => show(i); tabs.appendChild(b); });
function show(i) {
  const s = S[i];
  [...tabs.children].forEach((b, j) => b.classList.toggle("on", i === j));
  brief.innerHTML = s.brief; page.innerHTML = s.rules ? renderRules() : `<div class="screen-only">${renderScenario(s)}</div>${renderPrint(s)}`; window.scrollTo({ top: 0 });

  document.getElementById("pagestyle").textContent = `@page { @bottom-left { content: "MigrateLens report for ${nm}. Our best reading of SkillSelect data to Oct 2026, not a guarantee."; font: 8pt Archivo, sans-serif; color: #52606B; } @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt Archivo, sans-serif; color: #52606B; } }`;
  fitStamps(); document.fonts && document.fonts.ready.then(fitStamps);
}
function fitStamps() {
  document.querySelectorAll("text[data-fit]").forEach(t => {
    t.removeAttribute("textLength"); t.removeAttribute("lengthAdjust");
    const max = +t.dataset.fit; if (t.getComputedTextLength() > max) { t.setAttribute("textLength", max); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
  });
}
const qs = new URLSearchParams(location.search);
if (qs.get("embed")) document.body.classList.add("embed");
const start = Math.max(0, S.findIndex(x => x.id === qs.get("s")));
show(start);
if (document.fonts) Promise.all(["800 20px 'Big Shoulders Stencil Display'", "900 20px 'Big Shoulders Stencil Display'"].map(f => document.fonts.load(f))).then(fitStamps);
