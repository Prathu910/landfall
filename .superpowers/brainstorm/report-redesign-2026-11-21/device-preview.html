<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phone and tablet preview</title>
<style>
  body { margin: 0; background: #DDE3E0; font: 500 14px/1.4 system-ui, sans-serif; color: #12202C; }
  .bar { position: sticky; top: 0; z-index: 5; background: #12202C; padding: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .bar button { font: inherit; border: 1px solid #ffffff4d; background: transparent; color: #fff; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .bar button.on { background: #fff; color: #12202C; }
  .note { text-align: center; margin: 14px 16px 0; color: #52606B; }
  .stage { display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding: 20px; flex-wrap: wrap; }
  .dev { text-align: center; }
  .dev h2 { font-size: 15px; margin: 0 0 10px; }
  .phone { width: 390px; height: 844px; border: 12px solid #12202C; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px -30px #12202C; }
  .phone iframe { width: 390px; height: 844px; border: 0; }
  .tabletwrap { width: 615px; height: 885px; }
  .tablet { width: 820px; height: 1180px; border: 14px solid #12202C; border-radius: 36px; overflow: hidden; background: #fff; transform: scale(.75); transform-origin: top left; box-shadow: 0 30px 60px -30px #12202C; }
  .tablet iframe { width: 820px; height: 1180px; border: 0; }
</style></head>
<body>
<div class="bar" id="bar"></div>
<p class="note">Scroll inside each device. Phone is shown at real size (390 px); the tablet (820 px, iPad Air) is scaled to 75%. Tap the section chips at the top of each report.</p>
<div class="stage">
  <div class="dev"><h2>Phone</h2><div class="phone"><iframe id="ph" title="Phone preview"></iframe></div></div>
  <div class="dev"><h2>Tablet</h2><div class="tabletwrap"><div class="tablet"><iframe id="tb" title="Tablet preview"></iframe></div></div></div>
</div>
<script>
const list = [["strong","1. Strong"],["middle","2. In the middle"],["long","3. Long wait"],["notinv","4. 189 closed"],["below","5. Below 65"],["nodata","6. No data"],["none","7. Nothing suits"],["lodged","8. Already lodged"],["evidence","9. Evidence opened"],["rules","Label rules"]];
const bar = document.getElementById("bar");
list.forEach(([id, t]) => { const b = document.createElement("button"); b.textContent = t; b.dataset.choice = "preview-" + id; b.onclick = () => go(id); bar.appendChild(b); });
function go(id) {
  [...bar.children].forEach(b => b.classList.toggle("on", b.dataset.choice === "preview-" + id));
  const src = "report-e-final.html?embed=1&s=" + id;
  document.getElementById("ph").src = src; document.getElementById("tb").src = src;
}
go("strong");
</script>
</body></html>
