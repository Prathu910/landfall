n process and cut offs\u003c/h3\u003e\n\n\u003cp\u003eThe highest ranked individuals\u0026nbsp;by points score are invited to apply for the relevant visa. Those who have equal points scores, the time at which they reached their points score for that subclass (referred to as the date of effect) determines their order of invitation. Expressions of Interest with earlier dates of effect are invited before later dates.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable class=\&quot;table table-hover\&quot;\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003e\n\t\t\t\u003cp\u003e\u003cstrong\u003eVisa subclass\u003c/strong\u003e\u003c/p\u003e\n\t\t\t\u003c/th\u003e\n\t\t\t\u003cth\u003e\n\t\t\t\u003cp\u003e\u003cstrong\u003eMinimum points score\u003c/strong\u003e\u003c/p\u003e\n\t\t\t\u003c/th\u003e\n\t\t\t\u003cth\u003e\n\t\t\t\u003cp\u003e\u003cstrong\u003eLatest date of effect month\u003c/strong\u003e\u003c/p\u003e\n\t\t\t\u003c/th\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e\u003ca href=\&quot;https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/skilled-independent-189\&quot;\u003eSkilled Independent visa (subclass 189)\u003c/a\u003e\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e90\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e11/2020\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e\u003ca href=\&quot;https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/skilled-work-regional-provisional-491\&quot;\u003eSkilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored)\u003c/a\u003e\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e80\u003c/p\u003e\n\t\t\t\u003c/td\u003e\n\t\t\t\u003ctd\u003e\n\t\t\t\u003cp\u003e04/2020\u003c/ t;Invitations point score cut offs and their dates of effect\&quot;\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003eVisa subclass\u003c/th\u003e\n\t\t\t\u003cth\u003eMinimum points score\u003c/th\u003e\n\t\t\t\u003cth\u003eLatest date of effect month\u003c/th\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-independent-189\&quot;\u003eSkilled Independent visa (subclass 189)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e80\u003c/td\u003e\n\t\t\t\u003ctd\u003e07/2019\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-work-regional-provisional-491\&quot;\u003eSkilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e65\u003c/td\u003e\n\t\t\t\u003ctd\u003e03/2021\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\n\u003ch3\u003ePoint scores and the dates of effect cut off for the pro rata occupations in the\u0026nbsp;26 July 2021 invitation round.\u003c/h3\u003e\n\n\u003cp\u003eDue to high levels of demand, and in keeping with previous program years, the below occupation groups will be subject to pro rata arrangements to ensure availability of invitations across the program year.\u003c/p\u003e\n\n\u003cp\u003eSkillSelect first allocates available places to Skilled \u0026ndash; Independent visas (subclass 189), and thereafter the remaining to Skilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored. If all places are taken up by subclass 189 visas then there will be no invitations issued for subclass 491 visas in these occupations.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable class=\&quot;table table-hover\&quot;\u003e\n\t\u003ctbody\u003e\n\t\t\u0 amily Sponsored)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e65\u003c/td\u003e\n\t\t\t\u003ctd\u003e03/2021\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\n\u003ch3\u003ePoint scores and the dates of effect cut off for the pro rata occupations in the\u0026nbsp;21 April 2021 invitation round.\u003c/h3\u003e\n\n\u003cp\u003eDue to high levels of demand, and in keeping with previous program years, the below occupation groups will be subject to pro rata arrangements to ensure availability of invitations across the program year.\u003c/p\u003e\n\n\u003cp\u003eSkillSelect first allocates available places to Skilled \u0026ndash; Independent visas (subclass 189), and thereafter the remaining to Skilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored. If all places are taken up by subclass 189 visas then there will be no invitations issued for subclass 491 visas in these occupations.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable class=\&quot;table table-hover\&quot;\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003eSubclass\u003c/th\u003e\n\t\t\t\u003cth\u003eOccupation ID\u003c/th\u003e\n\t\t\t\u003cth\u003eDescription\u003c/th\u003e\n\t\t\t\u003cth\u003eMinimum points score\u003c/th\u003e\n\t\t\t\u003cth\u003eLatest date of effect month\u003c/th\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e189/491\u003c/td\u003e\n\t\t\t\u003ctd\u003e2211\u003c/td\u003e\n\t\t\t\u003ctd\u003eAccountants\u003c/td\u003e\n\t\t\t\u003ctd\u003eN/A\u003c/td\u003e\n\t\t\t\u003ctd\u003eN/A\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e189/491\u003c/td\u003e\n\t\t\t\u003ctd\u003e2212\u003c/td\u003e\n\t\t\t\u003ctd\u003eAuditors, Company Secretaries and Corporate Treasurers\u003c/td\u003e\n\t\t\t\u003ctd\u003eN/A\u003c/td\u003e\n\t\t\t\u003ctd\u003eN/A\u003c/td\u003e\ sional) visa (subclass 491) \u0026ndash; Family Sponsored\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e80\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\n\u003ch3\u003eInvitation process and cut offs\u003c/h3\u003e\n\n\u003cp\u003eThe highest ranked clients by points score are invited to apply for the relevant visa. For clients who have equal points scores, the time at which they reached their points score for that subclass (referred to as the date of effect) determines their order of invitation. Expressions of Interest with earlier dates of effect are invited before later dates.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable class=\&quot;table table-hover\&quot; summary=\&quot;Invitations point score cut offs and their dates of effect\&quot;\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003eVisa subclass\u003c/th\u003e\n\t\t\t\u003cth\u003eMinimum points score\u003c/th\u003e\n\t\t\t\u003cth\u003eLatest date of effect month\u003c/th\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-independent-189\&quot;\u003eSkilled Independent visa (subclass 189)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e65\u003c/td\u003e\n\t\t\t\u003ctd\u003e09/2020\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-work-regional-provisional-491\&quot;\u003eSkilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e65\u003c/td\u003e\n\t\t\t\u003ctd\u003e04/2020\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\n\u003ch3\u003ePoint scores and the dates of effect cut off for the pro rata occupations in the 21 October 2020 invitation round.\u003c/h3\u ember 2020\u003c/h3\u003e\n\n\u003cp\u003eThe table below shows the number of invitations issued in the SkillSelect invitation round on 11 September 2020.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable class=\&quot;table table-hover\&quot;\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003eVisa subclass\u003c/th\u003e\n\t\t\t\u003cth\u003eNumber\u003c/th\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-independent-189\&quot;\u003eSkilled Independent visa (subclass 189)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e350\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-work-regional-provisional-491\&quot;\u003eSkilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e150\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\n\u003ch3\u003eInvitation process and cut offs\u003c/h3\u003e\n\n\u003cp\u003eThe highest ranked clients by points score are invited to apply for the relevant visa. For clients who have equal points scores, the time at which they reached their points score for that subclass (referred to as the date of effect) determines their order of invitation. Expressions of Interest with earlier dates of effect are invited before later dates.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable class=\&quot;table table-hover\&quot; summary=\&quot;Invitations point score cut offs and their dates of effect\&quot;\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003eVisa subclass\u003c/th\u003e\n\t\t\t\u003cth\u003eMinimum points score\u003c/th\u003e\n\t\t\t\u003cth\u003eLatest date of effect month\u003c/th\u003e\n\t\t\u003c/tr\u003e cp\u003eThe highest ranked clients by points score are invited to apply for the relevant visa. For clients who have equal points scores, the time at which they reached their points score for that subclass (referred to as the date of effect) determines their order of invitation. Expressions of Interest with earlier dates of effect are invited before later dates.\u003c/p\u003e\n\n\u003cdiv class=\&quot;table-responsive\&quot;\u003e\n\u003ctable class=\&quot;table table-hover\&quot; summary=\&quot;Invitations point score cut offs and their dates of effect\&quot;\u003e\n\t\u003cthead\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003cth\u003eVisa subclass\u003c/th\u003e\n\t\t\t\u003cth\u003eMinimum points score\u003c/th\u003e\n\t\t\t\u003cth\u003eLatest date of effect month\u003c/th\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/thead\u003e\n\t\u003ctbody\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-independent-189\&quot;\u003eSkilled Independent visa (subclass 189)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e90\u003c/td\u003e\n\t\t\t\u003ctd\u003e07/2020\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\t\u003ctr\u003e\n\t\t\t\u003ctd\u003e\u003ca href=\&quot;/visas/getting-a-visa/visa-listing/skilled-work-regional-provisional-491\&quot;\u003eSkilled Work Regional (Provisional) visa (subclass 491) \u0026ndash; Family Sponsored)\u003c/a\u003e\u003c/td\u003e\n\t\t\t\u003ctd\u003e75\u003c/td\u003e\n\t\t\t\u003ctd\u003e06/2020\u003c/td\u003e\n\t\t\u003c/tr\u003e\n\t\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/div\u003e\n\n\u003ch3\u003ePoint scores and the dates of effect cut off for the pro rata occupations in the 11 August\u0026nbsp;2020 invitation round.\u003c/h3\u003e\n\n\u003cp\u003eDue to high levels of demand, and in keeping with previous program years, the below occupation groups will be subject to pro rata arrangements to ensure availability of invitations across the program year.\u003c/p\u003e\n\n\u003cp\u003eSkillSelect f
