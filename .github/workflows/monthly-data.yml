# Monthly SkillSelect import (spec 6.9). Probes the dashboard daily early in
# the month and, when a new as-at month is out, imports it, writes the recap
# and Instagram cards, runs every check and opens (or adds to) the one
# `data-update` pull request for the founder. Nothing merges or deploys
# without the founder. The job body is scripts/automation/monthly.sh.
name: Monthly SkillSelect data

on:
  schedule:
    # 20:30 UTC is 06:30-07:30 in Sydney; days 1-28 leave margin.
    - cron: "30 20 1-28 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Import this as-at month (YYYY-MM) instead of probing. With a spotlight, the open pull request's month."
        required: false
        type: string
        default: ""
      spotlight:
        description: "Six-digit occupation code: swap the open data pull request's spotlight."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  monthly:
    # Data branches start from main, so never run from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      BASE_REF: origin/main
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Ubuntu 24.04 limits unprivileged user namespaces through AppArmor,
      # which Chrome's sandbox needs. Lifting the limit on this throwaway VM
      # keeps the sandbox on (rather than launching Chrome with --no-sandbox).
      - name: Let Chrome start its sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          "$CHROME_PATH" --version

      - name: Import, check and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ inputs.month }}
          SPOTLIGHT: ${{ inputs.spotlight }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: bash scripts/automation/monthly.sh run 2>&1 | tee "$RUNNER_TEMP/monthly.log"

      - name: Collect the failed run's files
        if: failure()
        run: bash scripts/automation/monthly.sh collect-failure

      - name: Upload the failed run's files
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-data-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/import.json
            ${{ runner.temp }}/failure-raw/
          if-no-files-found: ignore
          retention-days: 7

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/automation/monthly.sh report-failure
